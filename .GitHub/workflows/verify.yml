name: Mirror-Quilt Lattice Certification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy requests

    - name: Run Mathematical Certification & Decomposition Bridge
      run: |
        python src/certify_mirror_quilt_v3.py

    - name: Verify Quilt-Mining Node & Funding Endpoint
      run: |
        python src/quilt_mining_node.py
